name = "buildsmart-nigeria-api"
main = "src/worker.js"
compatibility_date = "2025-10-01"

[vars]
RETENTION_HOURS = "24"

# Native 24-hour auto-expiring storage for user project links (.buildpack.json)
# Create with: npx wrangler kv namespace create PROJECTS_KV
[[kv_namespaces]]
binding = "PROJECTS_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Optional R2 bucket for Blender .glb 3D meshes & Unity WebGL/Android/VR Addressables
# Create with: npx wrangler r2 bucket create buildsmart-3d-assets
[[r2_buckets]]
binding = "ASSETS_R2"
bucket_name = "buildsmart-3d-assets"
