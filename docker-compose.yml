services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildsmart
      POSTGRES_PASSWORD: buildsmart_password
      POSTGRES_DB: buildsmart
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  app:
    build:
      context: .
    ports:
      - '6543:6543'
    environment:
      PORT: 6543
      DATABASE_URL: postgres://buildsmart:buildsmart_password@postgres:5432/buildsmart
    depends_on:
      - postgres

volumes:
  pgdata:
